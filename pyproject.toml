[project]
name = "canopy"
version = "0.1.0"
description = "Canopy — backend for the SLAC EED control-system display platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "aioca>=1.7",
    "p4p>=4.1",
    "numpy>=1.26",
    "numexpr>=2.8",
    "asteval>=1.0",
    "jsonschema>=4.21,<5",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "arq>=0.26",
    "redis>=5.0",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "hypothesis>=6.100",
]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings",
    "mkdocstrings-python",
    "mkdocs-git-revision-date-localized-plugin",
    "mkdocs-git-committers-plugin-2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canopy"]

[tool.ruff]
extend-exclude = ["__init__.py"]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "UP"]
ignore = ["E402", "E501"]

[tool.isort]
profile = "black"
color_output = true
extend_skip = ["__init__.py"]
length_sort = true
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
