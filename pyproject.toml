[project]
name = "canopy"
dynamic = ["version"]
description = "Canopy — backend for the SLAC EED control-system display platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121.1",
    # The oldest release that leaves the event-loop policy alone, so a subprocess
    # started under a served app can spawn; proven by the floors job.
    "uvicorn[standard]>=0.36",
    "pydantic>=2.7",
    # Hosts that embed CANOPY pin pydantic-settings below 2.12 (tiled caps it
    # at <2.12.0); nothing here needs a later release, so the floor stays
    # where those hosts can satisfy it.
    "pydantic-settings>=2.11",
    "httpx>=0.27",
    "aioca>=1.7",
    # The oldest release with a Python 3.12 wheel: every 4.1 release needs an EPICS
    # base (epicscorelibs < 7.0.7.99.1) built from source; proven by the floors job.
    "p4p>=4.2",
    "numpy>=1.26",
    # The oldest release that installs on Python 3.12 (from source: the first
    # cp312 wheel is 2.8.7), proven by the floors job.
    "numexpr>=2.8.3",
    "asteval>=1.0",
    "jsonschema>=4.21,<5",
    "python-multipart>=0.0.32",
    # The oldest release the live-frame encoding is tested with: numpy
    # arrays serialised natively, non-finite numbers as null.
    "orjson>=3.9.3",
    "markdown>=3.5",
    # GET /metrics and the per-route HTTP middleware (canopy.core.metrics) run in every process.
    "prometheus-client>=0.20",
    "nh3>=0.2.18",
]

[project.optional-dependencies]
# Postgres and the Redis job queue: needed by squirrel, magpie, jobs and the
# canopy-worker. A deployment that selects none of them (CANOPY_MODULES) runs
# without this extra.
data = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "arq>=0.26",
    "redis>=5.0",
]
# Legacy-screen conversion: needed by the converter module and its worker task.
convert = [
    "PyDMConverter>=1.1.0",
]

[dependency-groups]
dev = [
    "pre-commit>=3.6",
    "pytest>=8.0",
    # The oldest release that collects package directories under pytest 8, proven
    # by the floors job.
    "pytest-asyncio>=0.23.5",
    # The oldest release whose add_response takes is_reusable, which the e-log and
    # Mole adapter tests use; proven by the floors job.
    "pytest-httpx>=0.34",
    "hypothesis>=6.100",
    "import-linter>=2.0",
    # The oldest release that gives each FakeRedis() a server of its own, which the
    # tests rely on for isolation; proven by the floors job.
    "fakeredis>=2.21.3",
    "coverage>=7.15.1",
    "pyyaml>=6",
    "caproto>=1.1",
]
docs = [
    "zensical>=0.0.51",
    "mkdocstrings>=0.24",
    "mkdocstrings-python>=1.8",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/canopy"]

[tool.ruff]
extend-exclude = ["__init__.py"]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "UP"]
# isinstance takes a tuple of types; the union form is slower and ruff has since removed the rule.
ignore = ["E402", "E501", "UP038"]

[tool.isort]
profile = "black"
color_output = true
extend_skip = ["__init__.py"]
length_sort = true
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "perf: asserts timing bounds that hold on operator-class hardware; deselected on shared CI runners",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
relative_files = true
source = ["src/canopy"]
# Async SQLAlchemy runs queries in greenlets; without this, lines after a DB await go untraced.
concurrency = ["thread", "greenlet"]
omit = ["*/tests/*", "*/test_*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.importlinter]
root_package = "canopy"

# The converter must reach peer modules only through their public gateway —
# never their services/api/internals. The shared kernel (canopy.core,
# canopy.contracts) and each module's gateway are allowed.
[[tool.importlinter.contracts]]
name = "Converter reaches other modules only through their public gateway"
type = "forbidden"
source_modules = ["canopy.converter"]
forbidden_modules = [
    "canopy.formula_engine",
    "canopy.mole",
    "canopy.hare",
    "canopy.vole",
    "canopy.raccoon",
    "canopy.jobs",
]
ignore_imports = [
    "canopy.converter.dependencies -> canopy.formula_engine.gateway",
    "canopy.converter.api.v1.conversions -> canopy.jobs.gateway",
    "canopy.converter.tasks -> canopy.jobs.gateway",
]
