<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Canopy · Fox REST formula evaluation</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 1.5rem; max-width: 960px; }
  h1 { font-size: 1.25rem; margin: 0 0 .25rem; }
  .sub { color: #888; margin: 0 0 1rem; }
  fieldset { border: 1px solid #ccc; border-radius: 8px; margin: 0 0 1rem; padding: .75rem 1rem; }
  legend { padding: 0 .4rem; color: #888; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; }
  label { display: inline-flex; flex-direction: column; font-size: .75rem; color: #888; gap: .15rem; margin-right: .75rem; }
  input, select, textarea { font: inherit; padding: .35rem .5rem; border: 1px solid #bbb; border-radius: 6px; min-width: 14rem; }
  textarea { resize: vertical; min-height: 2.5rem; }
  button { font: inherit; padding: .4rem .8rem; border: 1px solid #888; border-radius: 6px; background: #f3f3f3; color: #1a1a1a; cursor: pointer; }
  button:hover { background: #e8e8e8; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; align-items: flex-end; flex-wrap: wrap; gap: .5rem; }
  .muted { color: #888; }
  code { background: rgba(127,127,127,.18); padding: .05rem .35rem; border-radius: 4px; }
  #result { background: #11151c; color: #c8d3e0; border-radius: 8px; padding: .75rem 1rem;
            font: 12px/1.45 ui-monospace, monospace; white-space: pre-wrap; min-height: 4rem; overflow: auto; max-height: 24rem; }
  .badge { display: inline-block; padding: .1rem .5rem; border-radius: 4px; font-size: .72rem; font-weight: 600; margin-left: .5rem; }
  .badge-ok { background: #2e9e44; color: #fff; }
  .badge-err { background: #c0392b; color: #fff; }
  .badge-pending { background: #555; color: #fff; }
</style>
</head>
<body>
  <h1>Canopy · Fox <span class="muted">REST formula evaluation</span></h1>
  <p class="sub">Evaluates a formula expression via <code>POST /fox/v1/evaluate</code>.
     Start the backend with <code>CANOPY_API_KEYS="dev:read+write" uv run uvicorn canopy.main:app</code> and open this file.</p>

  <fieldset>
    <legend>Connection</legend>
    <div class="row">
      <label>Base URL
        <input id="baseUrl" value="http://localhost:8000" size="30" />
      </label>
      <label>API key
        <input id="key" value="dev" style="min-width:8rem" />
      </label>
    </div>
  </fieldset>

  <fieldset>
    <legend>Formula spec</legend>
    <div class="row" style="margin-bottom:.5rem">
      <label>Kind
        <select id="kind" style="min-width:10rem">
          <option value="scalar">scalar</option>
          <option value="timeseries" selected>timeseries</option>
          <option value="waveform">waveform</option>
        </select>
      </label>
      <label>Mode
        <select id="mode" style="min-width:8rem">
          <option value="raw">raw</option>
          <option value="binned">binned</option>
        </select>
      </label>
      <label>Align
        <select id="align" style="min-width:8rem">
          <option value="last">last</option>
          <option value="interpolate">interpolate</option>
        </select>
      </label>
      <label>Index
        <select id="index" style="min-width:10rem">
          <option value="union">union</option>
          <option value="intersection">intersection</option>
          <option value="grid">grid</option>
          <option value="first_input">first_input</option>
        </select>
      </label>
    </div>
    <div class="row" style="margin-bottom:.5rem">
      <label style="flex:1">Expression
        <input id="expr" value="{sine} + {counter}" style="width:100%" placeholder='e.g. {current} * {voltage}' />
      </label>
    </div>
    <div class="row" style="margin-bottom:.5rem">
      <label style="flex:1">Bindings (JSON: token --> PV name)
        <textarea id="bindings" style="width:100%">{"sine": "TEST:SINE", "counter": "TEST:COUNTER"}</textarea>
      </label>
    </div>
    <div class="row">
      <label>t0 window (seconds, 0 = oldest buffered)
        <input id="t0Sec" type="number" value="5" step="1" style="min-width:6rem" />
      </label>
      <label>t0Ns (computed)
        <input id="t0" type="number" value="-5000000000" style="min-width:12rem" readonly />
      </label>
      <label>t1Ns (end, 0 = now)
        <input id="t1" type="number" value="0" style="min-width:10rem" />
      </label>
      <label>Max points
        <input id="maxPoints" type="number" value="500" style="min-width:6rem" />
      </label>
    </div>
  </fieldset>

  <fieldset>
    <legend>Actions</legend>
    <div class="row">
      <button id="evalBtn">Evaluate</button>
      <button id="validateBtn">Validate</button>
      <span id="statusBadge"></span>
    </div>
  </fieldset>

  <div id="result">Hit "Evaluate" or "Validate" to see results here.</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);

  function buildSpec() {
    const spec = {
      kind: $("kind").value,
      expression: $("expr").value,
      bindings: JSON.parse($("bindings").value),
      mode: $("mode").value,
      align: $("align").value,
      index: $("index").value,
    };
    const mp = parseInt($("maxPoints").value, 10);
    if (mp > 0) spec.maxPoints = mp;
    return spec;
  }

  function setBadge(type, text) {
    const cls = type === "ok" ? "badge-ok" : type === "err" ? "badge-err" : "badge-pending";
    $("statusBadge").innerHTML = `<span class="badge ${cls}">${text}</span>`;
  }

  async function doFetch(endpoint, body) {
    const url = $("baseUrl").value.replace(/\/$/, "") + endpoint;
    const apiKey = $("key").value.trim();
    setBadge("pending", "loading...");
    try {
      const resp = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-API-Key": apiKey },
        body: JSON.stringify(body),
      });
      const data = await resp.json();
      if (resp.ok) {
        setBadge("ok", `${resp.status} OK`);
      } else {
        setBadge("err", `${resp.status} ${data.code || "error"}`);
      }
      $("result").textContent = JSON.stringify(data, null, 2);
    } catch (err) {
      setBadge("err", "network error");
      $("result").textContent = "Error: " + err.message + "\n\nIs the backend running?";
    }
  }

  function syncT0() {
    const sec = parseFloat($("t0Sec").value) || 0;
    $("t0").value = sec === 0 ? "0" : String(-Math.abs(sec) * 1e9);
  }
  $("t0Sec").oninput = syncT0;

  $("evalBtn").onclick = () => {
    const body = {
      spec: buildSpec(),
      t0Ns: parseInt($("t0").value, 10) || 0,
      t1Ns: parseInt($("t1").value, 10) || 0,
    };
    doFetch("/fox/v1/evaluate", body);
  };

  $("validateBtn").onclick = () => {
    doFetch("/fox/v1/validate", buildSpec());
  };
})();
</script>
</body>
</html>
