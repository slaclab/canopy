# Two arms (primaries with wal_level=logical) and a head, for the replication
# end-to-end tests. The head's server reaches each arm by its service name. CI runs
# this project; for local runs each session uses its own servers instead.
#
#   docker compose -f tests/canopy/core/replication/docker-compose.yml up -d --wait
#   export CANOPY_TEST_REPLICATION_ARM1_DSN=postgresql://postgres:postgres@localhost:55442/postgres
#   export CANOPY_TEST_REPLICATION_ARM1_CONNINFO="host=arm1 port=5432"
#   export CANOPY_TEST_REPLICATION_ARM2_DSN=postgresql://postgres:postgres@localhost:55444/postgres
#   export CANOPY_TEST_REPLICATION_ARM2_CONNINFO="host=arm2 port=5432"
#   export CANOPY_TEST_REPLICATION_HEAD_DSN=postgresql://postgres:postgres@localhost:55443/postgres
#   uv run pytest tests/canopy/core/replication
#   docker compose -f tests/canopy/core/replication/docker-compose.yml down

name: canopy-replication-test

x-postgres: &postgres
  image: postgres:16
  environment:
    POSTGRES_PASSWORD: postgres
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres"]
    interval: 2s
    timeout: 5s
    retries: 30
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"

services:
  arm1:
    <<: *postgres
    command: ["postgres", "-c", "wal_level=logical"]
    ports:
      - "55442:5432"

  arm2:
    <<: *postgres
    command: ["postgres", "-c", "wal_level=logical"]
    ports:
      - "55444:5432"

  head:
    <<: *postgres
    ports:
      - "55443:5432"
