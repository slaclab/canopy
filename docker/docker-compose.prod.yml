# Production compose: app containers only.
#
# Postgres + Redis are NOT here. They are brought up once per instance by the
# Init Data Layer workflow (.github/workflows/init-data-layer.yml) and reached
# over the host's 127.0.0.1:<port> published by that workflow. The app runs with
# network_mode: host because the EPICS connector needs CA/PVA UDP broadcast.
#
# The software-factory container-deploy playbook copies this file to the target,
# writes a sibling .env (IMAGE=<ghcr>:<tag> plus the env rendered from the
# APP_SECRETS JSON - the only config source; no env files are committed), then
# runs `docker compose --env-file .env up -d`.

services:
  api:
    image: ${IMAGE}
    command: ["uvicorn", "canopy.main:app", "--host", "0.0.0.0", "--port", "${API_PORT:-8000}"]
    env_file: .env
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${API_PORT:-8000}/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    image: ${IMAGE}
    command: ["arq", "canopy.worker.WorkerSettings"]
    env_file: .env
    network_mode: host
    restart: unless-stopped
    deploy:
      replicas: 2
