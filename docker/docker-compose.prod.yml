# Production compose: app containers only. This is the reference for running
# Canopy at a facility; copy it next to a .env file and adapt it as needed.
#
# Postgres 16 and Redis 7 are NOT here. Run them however your site runs
# databases and point the app at them with CANOPY_DATABASE_URL and
# CANOPY_REDIS_URL.
#
# The app runs with network_mode: host because the EPICS connector needs CA/PVA
# UDP broadcast, which bridged networking breaks. The API listens on API_PORT
# (default 8000) directly on the host.
#
# All config comes from a sibling .env file: IMAGE=ghcr.io/slaclab/canopy:<tag>
# for the compose file itself, plus the app's CANOPY_* / EPICS_* settings.
# Start it with `docker compose up -d` from this directory; run
# `docker compose run --rm api alembic upgrade head` before starting a new image.
#
# Every service logs to stdout continuously and the docker daemon keeps those
# json-file logs without limit, so cap what is retained per container.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  api:
    image: ${IMAGE}
    command: ["uvicorn", "canopy.main:app", "--host", "0.0.0.0", "--port", "${API_PORT:-8000}"]
    env_file: .env
    network_mode: host
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      # python probe: the python:3.12-slim image has no curl.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:${API_PORT:-8000}/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    image: ${IMAGE}
    command: ["arq", "canopy.worker.WorkerSettings"]
    env_file: .env
    network_mode: host
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      # No HTTP endpoint; without this the worker inherits the image's API probe
      # (which under host networking would report the api's health, not its own).
      disable: true
    deploy:
      replicas: 2
