apiVersion: 1

providers:
  - name: canopy
    folder: Canopy
    type: file
    disableDeletion: false
    # The JSON files under dashboards/ are authoritative. Panels can be tweaked
    # in the UI for exploring, but Grafana refuses to save a provisioned
    # dashboard; export the JSON and commit it to change one.
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
