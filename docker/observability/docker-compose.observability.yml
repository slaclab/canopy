# Observability overlay: Loki (log store) + Promtail (log shipper) + Prometheus
# (metrics store) + Grafana (dashboards, auto-provisioned). Layer it on the base
# stack from the repo root:
#
#   docker compose -f docker/docker-compose.yml \
#                  -f docker/observability/docker-compose.observability.yml up -d
#
# Relative paths below resolve against docker/ (the first -f file's directory).
# The api/worker containers write JSON logs to /tmp/canopy-logs (bind-mounted
# in the base compose); Promtail tails that same host directory.
# See docs/observability/ for the full guide.
#
# YAML anchors do not cross compose files, so this overlay carries its own copy
# of the base file's json-file log cap.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  loki:
    image: grafana/loki:3.0.0
    container_name: canopy-loki
    logging: *default-logging
    command: -config.file=/etc/loki/config.yaml
    ports:
      - "${LOKI_HOST_PORT:-3100}:3100"
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/config.yaml:ro
      - canopy-loki-data:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.0.0
    container_name: canopy-promtail
    logging: *default-logging
    command: -config.file=/etc/promtail/config.yaml
    volumes:
      - ./observability/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /tmp/canopy-logs:/tmp/canopy-logs:ro
    depends_on:
      - loki
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: canopy-prometheus
    logging: *default-logging
    command: --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - canopy-prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: canopy-grafana
    logging: *default-logging
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - canopy-grafana-data:/var/lib/grafana
    depends_on:
      - loki
      - prometheus
    restart: unless-stopped

volumes:
  canopy-loki-data:
  canopy-prometheus-data:
  canopy-grafana-data:
