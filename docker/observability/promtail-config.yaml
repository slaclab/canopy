# Tails the JSON log files canopy-api / canopy-worker write to /tmp/canopy-logs
# (CANOPY_LOG_FORMAT=json + CANOPY_LOG_PATH, set in the base compose) and pushes
# them to Loki.
#
# Every line is a whole JSON object (see canopy.core.logging.JsonFormatter), so
# a plain `json` stage extracts fields — no regex. Only LOW-CARDINALITY fields
# become index labels (level / type / source); unbounded fields like `event`,
# `route`, and `session_id` are parsed at query time with `| json` instead, to
# keep Loki's index small.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: canopy
    static_configs:
      - targets: ["localhost"]
        labels:
          app: canopy
          job: canopy
          __path__: /tmp/canopy-logs/*.log
    pipeline_stages:
      - json:
          expressions:
            ts: ts
            level: level
            type: type
            source: source
      - labels:
          level: level
          type: type
          source: source
      - timestamp:
          source: ts
          format: RFC3339Nano
