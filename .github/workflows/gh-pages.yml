# Builds the documentation on every pull request to catch errors early, and
# publishes it to GitHub Pages whenever changes land on main.
# The steps live in slaclab/swapps-ci-helpers; bump the pinned SHA to pick up changes.

name: Build & Deploy Documentation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  docs:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: slaclab/swapps-ci-helpers/.github/workflows/docs.yml@27f807d1c019d924e6ceeb6a2a6e82e35d24bf68
