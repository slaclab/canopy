# This workflow will publish a new version of the documentation to the gh-pages branch

name: Build & Deploy Documentation

on:
  pull_request:
    branches:
      - main
    paths:
      - "mkdocs.yml"
      - "docs/**"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MKDOCS_GIT_COMMITTERS_APIKEY: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0  # Important for MkDocs to access commit history

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version-file: pyproject.toml

      - name: Install dependencies
        run: uv sync --group docs

      - name: Build Docs
        run: uv run mkdocs build --strict --verbose

      - name: Upload Built Docs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: built-docs
          path: ./site

  deploy:
    needs: build  # Ensures that the deploy step only runs after the build
    if: github.event_name == 'push'  # Only run deploy on push events
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to push to the gh-pages branch

    steps:
      - name: Download Built Docs
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: built-docs
          path: ./site

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
