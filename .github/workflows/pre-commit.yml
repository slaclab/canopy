name: pre-commit

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    # Run pre-commit directly rather than via pre-commit/action: that action
    # pulls in actions/cache by a floating tag, which the org's SHA-pinning
    # policy rejects as an unpinned transitive dependency.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        python-version: "3.12"
    - name: Run pre-commit
      run: uv run --group dev pre-commit run --all-files --show-diff-on-failure