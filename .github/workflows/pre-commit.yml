name: pre-commit

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    # Run pre-commit directly rather than via pre-commit/action: that action
    # pulls in actions/cache by a floating tag, which the org's SHA-pinning
    # policy rejects as an unpinned transitive dependency.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        python-version: "3.12"
    - name: Run pre-commit
      run: uv run --group dev pre-commit run --all-files --show-diff-on-failure