name: pre-commit

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    # Run pre-commit directly rather than via pre-commit/action: that action
    # pulls in actions/cache by a floating tag, which the org's SHA-pinning
    # policy rejects as an unpinned transitive dependency.
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    - name: Install uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      with:
        python-version: "3.12"
    - name: Run pre-commit
      run: uv run --group dev pre-commit run --all-files --show-diff-on-failure