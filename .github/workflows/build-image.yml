name: Build Image

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "tests/**"
      - "*.md"
      - ".github/workflows/gh-pages.yml"
      - ".github/workflows/pre-commit.yml"
      - ".github/workflows/run-test.yml"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "tests/**"
      - "*.md"
      - ".github/workflows/gh-pages.yml"
      - ".github/workflows/pre-commit.yml"
      - ".github/workflows/run-test.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  deployments: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set deployable image tag
        id: vars
        # Matches the bare short-sha tag produced by `type=sha,prefix=` below,
        # which is the tag pushed to GHCR on main and consumed by deploy-dev.
        run: echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.prod
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # APP_SECRETS_DEV is the ONLY config source for the DEV deploy (no env files
  # are committed), so a missing/malformed secret must fail here with a clear
  # message, not as a health-check timeout after a full deploy attempt. Same
  # script as deploy.yml's validate-secrets, for the one auto-deployed instance.
  validate-dev-secrets:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      APP_SECRETS_DEV: ${{ secrets.APP_SECRETS_DEV }}
    steps:
      - name: Checkout validation script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Validate APP_SECRETS_DEV
        run: SECRET_NAME=APP_SECRETS_DEV SECRET_VALUE="$APP_SECRETS_DEV" FACILITY=FACILITY_DEV bash .github/scripts/validate_app_secrets.sh

  # Auto-deploy every push to main to the DEV instance. LCLS/FACET/TESTFAC are
  # deployed manually via the Deploy workflow (workflow_dispatch).
  deploy-dev:
    needs: [build, validate-dev-secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: slaclab/software-factory/.github/workflows/container-deploy.yml@main
    with:
      component_name: canopy
      repository_name: canopy
      tag: ${{ needs.build.outputs.image_tag }}
      facilities: '["FACILITY_DEV"]'
      health_check_path: /health
      migration_command: 'alembic upgrade head'
    secrets:
      APP_SECRETS: ${{ secrets.APP_SECRETS_DEV }}
