name: Build Image

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "tests/**"
      - "*.md"
      - ".github/workflows/gh-pages.yml"
      - ".github/workflows/pre-commit.yml"
      - ".github/workflows/run-test.yml"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "tests/**"
      - "*.md"
      - ".github/workflows/gh-pages.yml"
      - ".github/workflows/pre-commit.yml"
      - ".github/workflows/run-test.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  deployments: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set deployable image tag
        id: vars
        # Matches the bare short-sha tag produced by `type=sha,prefix=` below,
        # which is the tag pushed to GHCR on main and consumed by deploy-dev.
        run: echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: docker/Dockerfile.prod
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dispatch-dev-deploy:
    name: Trigger dev deployment
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Mint deployment repo token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: swapps-deployment

      - name: Dispatch deploy
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ needs.build.outputs.image_tag }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository_owner }}/swapps-deployment/dispatches" \
            -f event_type=deploy-image \
            -f "client_payload[app]=canopy" \
            -f "client_payload[environment]=dev" \
            -f "client_payload[image]=$IMAGE"
