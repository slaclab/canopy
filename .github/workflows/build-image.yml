name: Build Image

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "tests/**"
      - "*.md"
      - ".github/workflows/gh-pages.yml"
      - ".github/workflows/pre-commit.yml"
      - ".github/workflows/run-test.yml"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "tests/**"
      - "*.md"
      - ".github/workflows/gh-pages.yml"
      - ".github/workflows/pre-commit.yml"
      - ".github/workflows/run-test.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  deployments: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set deployable image tag
        id: vars
        # Matches the bare short-sha tag produced by `type=sha,prefix=` below,
        # which is the tag pushed to GHCR on main and consumed by deploy-dev.
        run: echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: docker/Dockerfile.prod
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # APP_SECRETS_DEV is the ONLY config source for the DEV deploy (no env files
  # are committed), so a missing/malformed secret must fail here with a clear
  # message, not as a health-check timeout after a full deploy attempt. Same
  # check as deploy.yml's validate-secrets, for the one auto-deployed instance.
  validate-dev-secrets:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      APP_SECRETS_DEV: ${{ secrets.APP_SECRETS_DEV }}
    steps:
      - name: Validate APP_SECRETS_DEV
        run: |
          set -euo pipefail
          if [ -z "$APP_SECRETS_DEV" ]; then
            echo "::error::APP_SECRETS_DEV is empty. All DEV config (API_PORT, EPICS_*, URLs) lives in this secret - there are no committed env files. See DEPLOYMENT.md for the required JSON shape."
            exit 1
          fi
          echo "::add-mask::$APP_SECRETS_DEV"
          if ! printf '%s' "$APP_SECRETS_DEV" | jq -e 'type == "object"' >/dev/null 2>&1; then
            echo "::error::APP_SECRETS_DEV is not a JSON object. Re-store it as JSON (same shape software-factory/deploy.sh expects); a KEY=value/dotenv blob fails the jq merge."
            exit 1
          fi
          missing=$(printf '%s' "$APP_SECRETS_DEV" | jq -r '
            ((._shared // {}) * (.FACILITY_DEV // {})) as $m
            | ["API_PORT", "CANOPY_DATABASE_URL", "CANOPY_REDIS_URL"]
            | map(select((($m[.] // "") | tostring | length) == 0))
            | join(", ")')
          if [ -n "$missing" ]; then
            echo "::error::APP_SECRETS_DEV is missing required key(s) under \"FACILITY_DEV\" (or _shared): $missing. See DEPLOYMENT.md for the full secret shape."
            exit 1
          fi
          echo "APP_SECRETS_DEV validated."

  # Auto-deploy every push to main to the DEV instance. LCLS/FACET/TESTFAC are
  # deployed manually via the Deploy workflow (workflow_dispatch).
  deploy-dev:
    needs: [build, validate-dev-secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: slaclab/software-factory/.github/workflows/container-deploy.yml@main
    with:
      component_name: canopy
      repository_name: Canopy
      tag: ${{ needs.build.outputs.image_tag }}
      facilities: '["FACILITY_DEV"]'
      health_check_path: /health
      migration_command: 'alembic upgrade head'
    secrets:
      APP_SECRETS: ${{ secrets.APP_SECRETS_DEV }}
