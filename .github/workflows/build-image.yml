name: Build Image

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "tests/**"
      - "*.md"
      - ".github/workflows/gh-pages.yml"
      - ".github/workflows/pre-commit.yml"
      - ".github/workflows/run-test.yml"
  push:
    branches:
      - main
    # Release tags publish versioned images. Path filters don't apply to tag pushes.
    tags:
      - "v*"
    paths-ignore:
      - "docs/**"
      - "tests/**"
      - "*.md"
      - ".github/workflows/gh-pages.yml"
      - ".github/workflows/pre-commit.yml"
      - ".github/workflows/run-test.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Push from main and from release tags; pull requests and manual runs only build.
      PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set deployable image tag
        id: vars
        # Matches the bare short-sha tag produced by `type=sha,prefix=` below.
        run: echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` comes only from the type=raw line below, so it moves with main.
          # latest=false stops the semver tags from also moving it on a release tag.
          flavor: |
            latest=false
          # A release tag skips the short-sha tag, so a rebuild never re-points one.
          tags: |
            type=sha,prefix=,enable=${{ github.ref_type != 'tag' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.prod
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
