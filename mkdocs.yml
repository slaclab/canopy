# Project Information
site_name: Canopy
site_url: https://slaclab.github.io/Canopy/
site_author: SLAC National Accelerator Laboratory - EED / Software Applications Group
site_description:  Canopy is a planned platform for control system displays, tools and applications.

# Repository
repo_name: slaclab/Canopy
repo_url: https://github.com/slaclab/Canopy

# Configuration
theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - navigation.top
    - navigation.tabs
    - navigation.indexes
    - navigation.footer
    - search.highlight
    - search.share
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode

# Plugins
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            members_order: source
            show_root_toc_entry: false
            show_symbol_type_toc: true
            docstring_options:
              ignore_init_summary: true
            merge_init_into_class: true
  - git-revision-date-localized:
      exclude:
        - index.md
      enable_creation_date: true
      fallback_to_build_date: true
  - git-committers:
      exclude:
        - index.md
      repository: slaclab/Canopy
      branch: main

# Additional Configuration
extra:
  generator: false

# Extensions
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - images/
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.blocks.caption

# Page Tree
nav:
  - Home: index.md
  - Fox:
    - fox/index.md
    - REST API: fox/rest_api.md
    - WebSocket Subscriptions: fox/websocket.md
  - Vole:
    - vole/index.md
    - REST API: vole/rest_api.md
    - Configuration: vole/configuration.md
  - How To:
    - how_to/index.md
    - Custom archiver adapter: how_to/custom_archiver_adapter.md
    - Custom directory adapter: how_to/custom_directory_adapter.md
  - API Reference:
    - api_reference/index.md
    - Fox: api_reference/fox.md
    - Vole: api_reference/vole.md
