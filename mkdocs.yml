# Project Information
site_name: canopy
site_url: https://slaclab.github.io/canopy/
site_author: SLAC National Accelerator Laboratory - EED / Software Applications Group
site_description:  Canopy is a planned platform for control system displays, tools and applications.

# Repository
repo_name: slaclab/canopy
repo_url: https://github.com/slaclab/canopy

# Configuration
theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - navigation.top
    - navigation.tabs
    - navigation.indexes
    - navigation.footer
    - search.highlight
    - search.share
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: red
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: red
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode

# Plugins
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            members_order: source
            show_root_toc_entry: false
            show_symbol_type_toc: true
            docstring_options:
              ignore_init_summary: true
            merge_init_into_class: true

# Additional Configuration
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/slaclab
      name: SLAC GitHub
copyright: Copyright © 2026, The Board of Trustees of the Leland Stanford Junior

# Extensions
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - images/
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.blocks.caption

# Page Tree
nav:
  - Home: index.md
  - Getting Started: getting_started.md
  - Modules:
    - modules/index.md
    - Hare:
      - hare/index.md
      - REST API: hare/rest_api.md
      - WebSocket Stream: hare/websocket.md
    - Fox:
      - fox/index.md
      - REST API: fox/rest_api.md
      - WebSocket Subscriptions: fox/websocket.md
    - Vole:
      - vole/index.md
      - REST API: vole/rest_api.md
      - Configuration: vole/configuration.md
    - E-log: elog/index.md
  - Deployment:
    - deployment/index.md
    - Docker Compose: deployment/docker.md
    - Facility Deployment: deployment/facilities.md
    - API Keys: deployment/api-keys.md
  - How To:
    - Custom archiver adapter: how_to/custom_archiver_adapter.md
    - Custom directory adapter: how_to/custom_directory_adapter.md
  - Observability:
    - observability/index.md
    - Setup guide: observability/setup_guide.md
    - Metrics: observability/metrics.md
  - API Reference:
    - Fox: api_reference/fox.md
    - Vole: api_reference/vole.md
